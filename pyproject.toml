# How Python installs Akashi (pip install -e . / pip install .). The code is
# the akashi/ folder; tests/ aren't installed. Akashi imports Monomi as a
# library, pinned to the release whose contract test locks the fields it reads.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "akashi"
description = "0x41 / akashi - prove Monomi's leads, give the fix, re-check"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "0x41" }]
requires-python = ">=3.14"
dynamic = ["version"]
dependencies = [
    "monomi @ git+https://github.com/0x41io/monomi@v1.22.0",
    # registrable-domain extraction (Public Suffix List) for the registry check;
    # pinned to its bundled snapshot at runtime so it never fetches
    "tldextract>=5",
]

[project.urls]
Homepage = "https://github.com/0x41io/akashi"

[project.scripts]
akashi = "akashi.cli:main"

[tool.setuptools.dynamic]
version = { attr = "akashi.__version__" }

[tool.setuptools.packages.find]
include = ["akashi", "akashi.*"]
